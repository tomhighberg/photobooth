<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PhotoBooth — Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:      #060606;
  --white:   #F0EDE8;
  --muted:   #444;
  --dim:     #777;
  --yellow:  #F5C842;
  --display: 'Bebas Neue', sans-serif;
  --body:    'DM Sans', sans-serif;
}

html, body {
  height:100%; overflow:hidden; cursor:none;
  background: var(--bg); color: var(--white);
  font-family: var(--body);
}

/* ── SLIDESHOW LAYER ── */
.slide-stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.slide {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 1.2s ease;
  pointer-events: none;
}
.slide.active {
  opacity: 1;
  z-index: 2;
}
.slide.exiting {
  opacity: 0;
  z-index: 1;
}

.slide-photo {
  max-width: 82vw;
  max-height: 78vh;
  border-radius: 8px;
  background: #111;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.6),
    0 0 0 1px rgba(240,237,232,0.04);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
/* aspect ratios for different template types */
.slide-photo.single { width: 72vmin; aspect-ratio: 3/2; }
.slide-photo.strip  { width: 32vmin; aspect-ratio: 2/5; }
.slide-photo.grid   { width: 60vmin; aspect-ratio: 1/1; }

/* ── CAPTION ── */
.slide-caption {
  position: absolute;
  bottom: 6vh;
  left: 0;
  right: 0;
  text-align: center;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.8s 0.4s ease, transform 0.8s 0.4s ease;
  z-index: 3;
  pointer-events: none;
}
.slide.active .slide-caption {
  opacity: 1;
  transform: none;
}
.caption-template {
  font-family: var(--display);
  font-size: 28px;
  letter-spacing: 0.04em;
  margin-bottom: 2px;
}
.caption-time {
  font-size: 13px;
  color: var(--dim);
}

/* ── EVENT BADGE (top-left corner) ── */
.event-badge {
  position: fixed;
  top: 28px;
  left: 32px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 10px;
}
.event-badge .badge-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--yellow);
  animation: livePulse 2.5s ease-in-out infinite;
}
@keyframes livePulse {
  0%,100% { opacity:1; box-shadow:0 0 0 0 rgba(245,200,66,0.4); }
  50% { opacity:0.6; box-shadow:0 0 0 6px rgba(245,200,66,0); }
}
.event-badge .badge-text {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 0.04em;
  opacity: 0.7;
}

/* ── PHOTO COUNTER (top-right) ── */
.photo-counter {
  position: fixed;
  top: 32px;
  right: 32px;
  z-index: 10;
  font-family: var(--display);
  font-size: 20px;
  letter-spacing: 0.04em;
  opacity: 0.35;
}

/* ── PROGRESS DOTS (bottom) ── */
.progress-dots {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  z-index: 10;
}
.pdot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--muted);
  transition: background 0.4s, transform 0.3s;
}
.pdot.active {
  background: var(--yellow);
  transform: scale(1.4);
}

/* ── IDLE STATE ── */
.idle-screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 5;
  text-align: center;
}
.idle-screen.hidden { display: none; }
.idle-title {
  font-family: var(--display);
  font-size: 72px;
  line-height: 0.92;
  letter-spacing: 0.02em;
  margin-bottom: 12px;
}
.idle-sub {
  font-size: 16px;
  color: var(--dim);
  line-height: 1.5;
}
.idle-waiting {
  margin-top: 32px;
  display: flex;
  gap: 8px;
}
.idle-waiting .w-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muted);
  animation: waitBounce 1.4s ease-in-out infinite;
}
.idle-waiting .w-dot:nth-child(2) { animation-delay: 0.15s; }
.idle-waiting .w-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes waitBounce {
  0%,80%,100% { transform:translateY(0); opacity:0.3; }
  40% { transform:translateY(-10px); opacity:1; }
}

/* ── FLASH EFFECT (fires on new photo) ── */
.flash-overlay {
  position: fixed;
  inset: 0;
  background: white;
  z-index: 20;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.08s;
}
.flash-overlay.fire {
  opacity: 0.7;
  transition: none;
}

/* ── VIGNETTE ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
}

/* grain */
body::after {
  content:''; position:fixed; inset:0; z-index: 5; pointer-events:none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.25;
}
</style>
</head>
<body>

<!-- EVENT BADGE -->
<div class="event-badge">
  <div class="badge-dot"></div>
  <div class="badge-text" id="badgeText">Tom's Photobooth</div>
</div>

<!-- COUNTER -->
<div class="photo-counter" id="photoCounter"></div>

<!-- SLIDESHOW -->
<div class="slide-stage" id="slideStage"></div>

<!-- PROGRESS DOTS -->
<div class="progress-dots" id="progressDots"></div>

<!-- IDLE SCREEN -->
<div class="idle-screen" id="idleScreen">
  <div class="idle-title" id="idleTitle">Tom's Photobooth</div>
  <div class="idle-sub">Photos will appear here as they're taken</div>
  <div class="idle-waiting">
    <div class="w-dot"></div><div class="w-dot"></div><div class="w-dot"></div>
  </div>
</div>

<!-- FLASH -->
<div class="flash-overlay" id="flashOverlay"></div>

<script>
// ══════════════════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════════════════

const EVENT_NAME = "Tom's Photobooth";
const SLIDE_INTERVAL = 6000;    // ms between slides
const POLL_INTERVAL  = 4000;    // ms between photo list polls
const MAX_DOTS       = 16;      // hide dots if more photos than this


// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════

let photos = [];
let currentSlide = -1;
let slideTimer = null;
let knownIds = new Set();

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('badgeText').textContent = EVENT_NAME;
  document.getElementById('idleTitle').textContent = EVENT_NAME;
    fetchPhotos();
    setInterval(fetchPhotos, POLL_INTERVAL);
  }
);


function fetchPhotos() {
  fetch('/api/photos')
    .then(r => r.json())
    .then(data => {
      const list = data.photos || data;
      // Detect new arrivals
      const newOnes = list.filter(p => !knownIds.has(p.id));
      photos = list;
      list.forEach(p => knownIds.add(p.id));
      if (newOnes.length > 0) {
        onPhotosUpdated(newOnes[newOnes.length - 1]);
      }
    });
}

// ══════════════════════════════════════════════════════════════
//  PHOTO ARRIVED
// ══════════════════════════════════════════════════════════════

function onPhotosUpdated(newestPhoto) {
  // Hide idle screen
  document.getElementById('idleScreen').classList.add('hidden');

  // Register new IDs
  photos.forEach(p => knownIds.add(p.id));

  // Update counter
  document.getElementById('photoCounter').textContent =
    `${photos.length} photo${photos.length !== 1 ? 's' : ''}`;

  // Flash effect for new photo
  fireFlash();

  // Jump to newest photo
  buildSlides();
  showSlide(photos.length - 1);

  // Restart auto-advance
  clearInterval(slideTimer);
  slideTimer = setInterval(advanceSlide, SLIDE_INTERVAL);
}

// ══════════════════════════════════════════════════════════════
//  SLIDES
// ══════════════════════════════════════════════════════════════

function buildSlides() {
  const stage = document.getElementById('slideStage');
  stage.innerHTML = '';

  photos.forEach((p, i) => {
   

    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.dataset.index = i;

    // In real mode, use <img>. Mock uses colored placeholder.
    const photoClass = p.type === 'strip' ? 'strip' :
                       p.type === 'grid'  ? 'grid'  : 'single';

    slide.innerHTML = `
      <div class="slide-photo ${photoClass}">
        <img src="/photos/${p.file}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" alt="${p.template}">
      </div>
      <div class="slide-caption">
        <div class="caption-template">${p.template}</div>
        <div class="caption-time">${p.time}</div>
      </div>`;

    stage.appendChild(slide);
  });

  buildDots();
}

function showSlide(index) {
  if (photos.length === 0) return;
  index = ((index % photos.length) + photos.length) % photos.length;

  const slides = document.querySelectorAll('.slide');
  slides.forEach((s, i) => {
    if (i === currentSlide) {
      s.classList.remove('active');
      s.classList.add('exiting');
      setTimeout(() => s.classList.remove('exiting'), 1400);
    } else {
      s.classList.remove('active', 'exiting');
    }
  });

  currentSlide = index;
  if (slides[index]) slides[index].classList.add('active');

  // Update dots
  document.querySelectorAll('.pdot').forEach((d, i) =>
    d.classList.toggle('active', i === index));
}

function advanceSlide() {
  if (photos.length === 0) return;
  showSlide(currentSlide + 1);
}

// ── Progress dots ──
function buildDots() {
  const el = document.getElementById('progressDots');
  if (photos.length > MAX_DOTS || photos.length <= 1) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = photos.map((_, i) =>
    `<div class="pdot${i === currentSlide ? ' active' : ''}"></div>`
  ).join('');
}

// ── Flash effect ──
function fireFlash() {
  const el = document.getElementById('flashOverlay');
  el.classList.add('fire');
  setTimeout(() => {
    el.classList.remove('fire');
  }, 120);
}

// ══════════════════════════════════════════════════════════════
//  KEYBOARD CONTROLS (for testing / manual override)
//  ← → to navigate, F for fullscreen, Space to pause
// ══════════════════════════════════════════════════════════════

let paused = false;

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') {
    showSlide(currentSlide + 1);
    resetAutoAdvance();
  }
  if (e.key === 'ArrowLeft') {
    showSlide(currentSlide - 1);
    resetAutoAdvance();
  }
  if (e.key === ' ') {
    e.preventDefault();
    paused = !paused;
    if (paused) {
      clearInterval(slideTimer);
    } else {
      slideTimer = setInterval(advanceSlide, SLIDE_INTERVAL);
    }
  }
  if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }
});

function resetAutoAdvance() {
  if (!paused) {
    clearInterval(slideTimer);
    slideTimer = setInterval(advanceSlide, SLIDE_INTERVAL);
  }
}

// Show cursor on mouse move, hide after 2s idle
let cursorTimer = null;
document.addEventListener('mousemove', () => {
  document.body.style.cursor = 'default';
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => {
    document.body.style.cursor = 'none';
  }, 2000);
});
</script>
</body>
</html>
