<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PhotoBooth — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --bg:      #0C0C0C;
  --mid:     #141414;
  --card:    #1A1A1A;
  --border:  #262626;
  --white:   #F0EDE8;
  --muted:   #555;
  --dim:     #888;
  --yellow:  #F5C842;
  --red:     #E8412A;
  --green:   #3DD68C;
  --amber:   #F5A623;
  --display: 'Bebas Neue', sans-serif;
  --body:    'DM Sans', sans-serif;
  --mono:    'JetBrains Mono', monospace;
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: var(--body);
  min-height: 100dvh;
  overflow-x: hidden;
}

/* grain */
body::after {
  content:''; position:fixed; inset:0; z-index:999; pointer-events:none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.35;
}

/* ── LAYOUT ── */
.admin-wrap {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 16px 100px;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.header-left .eyebrow {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.header-left .event-name {
  font-family: var(--display);
  font-size: 32px;
  line-height: 1;
  letter-spacing: 0.02em;
}
.booth-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 6px 12px;
  border-radius: 6px;
  background: rgba(61,214,140,0.1);
  color: var(--green);
  border: 1px solid rgba(61,214,140,0.2);
}
.booth-status .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s ease-in-out infinite;
}
.booth-status.offline {
  background: rgba(232,65,42,0.1);
  color: var(--red);
  border-color: rgba(232,65,42,0.2);
}
.booth-status.offline .dot {
  background: var(--red);
  animation: none;
}
@keyframes pulse {
  0%,100% { opacity:1; }
  50% { opacity:0.4; }
}

/* ── CARDS ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 12px;
}
.card-label {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}

/* ── SESSION CARD ── */
.session-state {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.state-badge {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  padding: 5px 10px;
  border-radius: 5px;
  letter-spacing: 0.04em;
}
.state-badge.idle {
  background: rgba(85,85,85,0.2);
  color: var(--dim);
  border: 1px solid var(--border);
}
.state-badge.shooting {
  background: rgba(245,200,66,0.12);
  color: var(--yellow);
  border: 1px solid rgba(245,200,66,0.25);
}
.state-badge.reviewing {
  background: rgba(61,214,140,0.1);
  color: var(--green);
  border: 1px solid rgba(61,214,140,0.2);
}
.state-badge.printing {
  background: rgba(245,166,35,0.1);
  color: var(--amber);
  border: 1px solid rgba(245,166,35,0.2);
}
.session-detail {
  font-size: 13px;
  color: var(--dim);
  line-height: 1.5;
}
.session-detail strong {
  color: var(--white);
  font-weight: 600;
}

/* ── PRINTER CARD ── */
.printer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.printer-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 12px;
}
.printer-status .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
}
.printer-status.online .dot { background: var(--green); }
.printer-status.offline .dot { background: var(--red); }
.printer-status.busy .dot { background: var(--amber); animation: pulse 1s ease-in-out infinite; }

.queue-count {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--dim);
}

/* paper gauge */
.paper-gauge {
  margin-top: 4px;
}
.gauge-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.gauge-label {
  font-size: 12px;
  color: var(--dim);
}
.gauge-count {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 500;
}
.gauge-count .of {
  font-size: 12px;
  color: var(--muted);
}
.gauge-track {
  width: 100%;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.gauge-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.6s ease, background 0.4s ease;
}
.gauge-fill.healthy { background: var(--green); }
.gauge-fill.low     { background: var(--amber); }
.gauge-fill.critical{ background: var(--red); }

/* ── STATS ROW ── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 12px;
}
.stat-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 12px;
  text-align: center;
}
.stat-num {
  font-family: var(--display);
  font-size: 36px;
  line-height: 1;
  margin-bottom: 2px;
}
.stat-label {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ── RECENT PHOTOS ── */
.recent-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 8px;
  scrollbar-width: none;
}
.recent-scroll::-webkit-scrollbar { display:none; }
.recent-thumb {
  flex: 0 0 90px;
  height: 60px;
  border-radius: 6px;
  background: var(--mid);
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
  cursor: pointer;
}
.recent-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.recent-thumb .time {
  position: absolute;
  bottom: 3px;
  right: 5px;
  font-size: 8px;
  color: rgba(255,255,255,0.8);
  font-family: var(--mono);
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}
.recent-empty {
  font-size: 13px;
  color: var(--muted);
  padding: 16px 0;
}

/* ── PHOTO MANAGEMENT GRID ── */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 4px;
}
.photo-tile {
  position: relative;
  aspect-ratio: 3/2;
  border-radius: 6px;
  overflow: hidden;
  background: var(--mid);
  border: 2px solid transparent;
  cursor: pointer;
  transition: border-color 0.15s;
}
.photo-tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.photo-tile.selected {
  border-color: var(--yellow);
}
.photo-tile .check {
  position: absolute;
  top: 5px;
  left: 5px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.6);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  transition: all 0.15s;
}
.photo-tile.selected .check {
  background: var(--yellow);
  border-color: var(--yellow);
  color: var(--bg);
}
.photo-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.photo-card-header .card-label { margin-bottom: 0; }
.grid-toggle {
  display: flex;
  background: var(--mid);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.toggle-btn {
  padding: 5px 10px;
  font-size: 11px;
  font-family: var(--mono);
  font-weight: 500;
  letter-spacing: 0.04em;
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.toggle-btn.active {
  background: var(--border);
  color: var(--white);
}
.photo-mgmt-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  gap: 8px;
}
.photo-mgmt-toolbar .select-all-btn {
  font-size: 12px;
  color: var(--dim);
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--body);
  padding: 0;
}
.photo-mgmt-toolbar .select-all-btn:hover { color: var(--white); }
.delete-selected-btn {
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid rgba(232,65,42,0.35);
  background: rgba(232,65,42,0.1);
  color: var(--red);
  font-family: var(--body);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.delete-selected-btn:disabled {
  opacity: 0.3;
  pointer-events: none;
}
.delete-selected-btn:active { background: rgba(232,65,42,0.2); }
.photo-empty {
  font-size: 13px;
  color: var(--muted);
  padding: 20px 0;
  text-align: center;
}
.raw-tile-label {
  position: absolute;
  bottom: 4px;
  left: 4px;
  font-size: 8px;
  font-family: var(--mono);
  color: rgba(255,255,255,0.7);
  text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  line-height: 1;
}

/* ── LIGHTBOX ── */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 500;
  background: rgba(0,0,0,0.88);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: lbFadeIn 0.2s ease;
}
.lightbox.open { display: flex; }
@keyframes lbFadeIn { from{opacity:0} to{opacity:1} }
.lb-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: none;
  color: var(--white);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lb-image {
  width: 100%;
  max-width: 800px;
  aspect-ratio: 3/2;
  background: var(--card);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 16px;
}
.lb-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.lb-meta {
  text-align: center;
  margin-bottom: 20px;
}
.lb-template {
  font-family: var(--display);
  font-size: 24px;
  letter-spacing: 0.02em;
}
.lb-time {
  font-size: 12px;
  color: var(--dim);
  margin-top: 2px;
}
.lb-actions {
  display: flex;
  gap: 10px;
}
.lb-btn {
  padding: 12px 28px;
  border-radius: 100px;
  font-family: var(--body);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: transform 0.1s;
}
.lb-btn:active { transform: scale(0.96); }
.lb-btn.primary {
  background: var(--yellow);
  color: var(--bg);
}
.lb-btn.ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--white);
}

/* ── ACTIONS ── */
.actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}
.action-btn {
  width: 100%;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--white);
  font-family: var(--body);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.15s ease;
}
.action-btn:active {
  transform: scale(0.98);
  background: var(--border);
}
.action-btn.warn {
  border-color: rgba(232,65,42,0.25);
  color: var(--red);
}
.action-btn.warn:active {
  background: rgba(232,65,42,0.1);
}
.action-btn.primary {
  background: var(--yellow);
  color: var(--bg);
  border-color: var(--yellow);
  font-weight: 600;
}
.action-btn.primary:active {
  background: #e0b53b;
}
.action-btn:disabled {
  opacity: 0.35;
  pointer-events: none;
}

/* ── LOG ── */
.log-area {
  margin-top: 4px;
  max-height: 180px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.log-entry {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  padding: 4px 0;
  border-bottom: 1px solid rgba(38,38,38,0.5);
  line-height: 1.5;
}
.log-entry .log-time {
  color: var(--muted);
  margin-right: 6px;
}
.log-entry .log-ok   { color: var(--green); }
.log-entry .log-warn { color: var(--amber); }
.log-entry .log-err  { color: var(--red); }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--white);
  color: var(--bg);
  font-size: 13px;
  font-weight: 600;
  padding: 10px 20px;
  border-radius: 100px;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
  z-index: 1000;
  pointer-events: none;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* ── CONFIRM MODAL ── */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 900;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-bg.open { display: flex; }
.modal-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  max-width: 320px;
  width: 100%;
  text-align: center;
}
.modal-box h3 {
  font-family: var(--display);
  font-size: 28px;
  margin-bottom: 8px;
}
.modal-box p {
  font-size: 13px;
  color: var(--dim);
  margin-bottom: 20px;
  line-height: 1.5;
}
.modal-actions {
  display: flex;
  gap: 8px;
}
.modal-actions button {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  font-family: var(--body);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
}
.modal-cancel {
  background: var(--border);
  color: var(--white);
}
.modal-confirm {
  background: var(--yellow);
  color: var(--bg);
}
.modal-confirm.danger {
  background: var(--red);
  color: var(--white);
}
</style>
</head>
<body>

<div class="admin-wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="eyebrow">PhotoBooth Admin</div>
      <div class="event-name" id="eventName">Rowan's 45th</div>
    </div>
    <div class="booth-status" id="boothStatus">
      <div class="dot"></div>
      <span id="boothStatusText">Online</span>
    </div>
  </div>

  <!-- SESSION -->
  <div class="card">
    <div class="card-label">Current Session</div>
    <div class="session-state">
      <div class="state-badge idle" id="stateBadge">Idle</div>
    </div>
    <div class="session-detail" id="sessionDetail">
      Booth is waiting for a guest.
    </div>
  </div>

  <!-- PRINTER -->
  <div class="card">
    <div class="card-label">Printer</div>
    <div class="printer-row">
      <div class="printer-status online" id="printerStatus">
        <div class="dot"></div>
        <span id="printerStatusText">Online</span>
      </div>
      <div class="queue-count" id="queueCount">Queue: 0</div>
    </div>
    <div class="paper-gauge">
      <div class="gauge-header">
        <span class="gauge-label">Paper remaining</span>
        <span class="gauge-count"><span id="paperNum">92</span><span class="of"> / 108</span></span>
      </div>
      <div class="gauge-track">
        <div class="gauge-fill healthy" id="gaugeFill" style="width:85.2%"></div>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-num" id="statShots">0</div>
      <div class="stat-label">Shots</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="statPrints">0</div>
      <div class="stat-label">Prints</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="statSessions">0</div>
      <div class="stat-label">Sessions</div>
    </div>
  </div>

  <!-- RECENT PHOTOS -->
  <div class="card">
    <div class="card-label">Recent Photos</div>
    <div class="recent-scroll" id="recentScroll">
      <div class="recent-empty">No photos yet — booth is idle</div>
    </div>
  </div>

  <!-- PHOTO MANAGEMENT -->
  <div class="card">
    <div class="photo-card-header">
      <div class="card-label">Photo Management</div>
      <div class="grid-toggle">
        <button class="toggle-btn active" id="btnComposites" onclick="setGridMode('composites')">Composites</button>
        <button class="toggle-btn" id="btnRaws" onclick="setGridMode('raws')">Raw Shots</button>
      </div>
    </div>
    <div class="photo-grid" id="photoGrid">
      <div class="photo-empty">Loading photos…</div>
    </div>
    <div class="photo-mgmt-toolbar">
      <button class="select-all-btn" onclick="toggleSelectAll()" id="selectAllBtn">Select all</button>
      <button class="delete-selected-btn" id="deleteBtn" disabled onclick="confirmDeleteSelected()">Delete Selected</button>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="card">
    <div class="card-label">Actions</div>
    <div class="actions">
      <button class="action-btn primary" onclick="newCartridge()">
        🔄 New Cartridge (Reset to 108)
      </button>
      <button class="action-btn" onclick="cancelSession()" id="btnCancel" disabled>
        ✖ Cancel Current Session
      </button>
      <button class="action-btn warn" onclick="confirmShutdown()">
        ⏻ Shutdown Booth
      </button>
    </div>
  </div>

  <!-- EVENT LOG -->
  <div class="card">
    <div class="card-label">Event Log</div>
    <div class="log-area" id="logArea"></div>
  </div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <div class="lb-image"><img id="lbImage" src="" alt=""></div>
  <div class="lb-meta">
    <div class="lb-template" id="lbTemplate"></div>
    <div class="lb-time" id="lbTime"></div>
  </div>
  <div class="lb-actions">
    <button class="lb-btn primary" onclick="downloadLightboxPhoto()">📲 Save</button>
    <button class="lb-btn ghost" onclick="closeLightbox()">Close</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- CONFIRM MODAL -->
<div class="modal-bg" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">Confirm</h3>
    <p id="modalBody">Are you sure?</p>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-confirm" id="modalConfirm" onclick="modalAction()">Confirm</button>
    </div>
  </div>
</div>

<script>

// ── State ──
const state = {
  event:    'PhotoBooth',
  boothUp:  true,
  session:  'idle',       // idle | shooting | reviewing | printing
  template: null,
  shotNum:  0,
  shotsTotal: 0,
  printer:  'online',     // online | offline | busy
  printerName: 'CP1500',
  paper:    108,
  queue:    0,
  shots:    0,
  prints:   0,
  sessions: 0,
  photos:   [],           // { id, time, template }
  log:      []
};

let allPhotos = [];       // full registry from /api/photos
let selectedIds = new Set();
let lightboxPhoto = null;

// ── Boot ──
window.addEventListener('DOMContentLoaded', () => {
  poll();
  loadAllPhotos();
});

// ══════════════════════════════════════════════════════════════
//  RENDER — reads state, updates DOM. Called after every change.
// ══════════════════════════════════════════════════════════════

function render() {
  // Event name
  document.getElementById('eventName').textContent = state.event;

  // Booth status
  const bs = document.getElementById('boothStatus');
  const bst = document.getElementById('boothStatusText');
  bs.className = 'booth-status' + (state.boothUp ? '' : ' offline');
  bst.textContent = state.boothUp ? 'Online' : 'Offline';

  // Session badge
  const badge = document.getElementById('stateBadge');
  badge.className = 'state-badge ' + state.session;
  badge.textContent = state.session.charAt(0).toUpperCase() + state.session.slice(1);

  // Session detail
  const detail = document.getElementById('sessionDetail');
  if (state.session === 'idle') {
    detail.innerHTML = 'Booth is waiting for a guest.';
  } else if (state.session === 'shooting') {
    detail.innerHTML = `Template: <strong>${state.template}</strong> · Shot ${state.shotNum}/${state.shotsTotal}`;
  } else if (state.session === 'reviewing') {
    detail.innerHTML = `Template: <strong>${state.template}</strong> · Guest reviewing`;
  } else if (state.session === 'printing') {
    detail.innerHTML = `Template: <strong>${state.template}</strong> · Printing…`;
  }

  // Cancel button
  document.getElementById('btnCancel').disabled = (state.session === 'idle');

  // Printer
  const ps = document.getElementById('printerStatus');
  ps.className = 'printer-status ' + state.printer;
  const printerLabel = state.printer.charAt(0).toUpperCase() + state.printer.slice(1);
  document.getElementById('printerStatusText').textContent =
    (state.printerName || 'Printer') + ' — ' + printerLabel;
  document.getElementById('queueCount').textContent = state.queue > 0
    ? `Queue: ${state.queue} job${state.queue !== 1 ? 's' : ''}`
    : 'Queue: idle';

  // Paper gauge
  const pct = (state.paper / 108) * 100;
  const fill = document.getElementById('gaugeFill');
  fill.style.width = pct + '%';
  fill.className = 'gauge-fill ' + (pct > 30 ? 'healthy' : pct > 12 ? 'low' : 'critical');
  document.getElementById('paperNum').textContent = state.paper;

  // Stats
  document.getElementById('statShots').textContent = state.shots;
  document.getElementById('statPrints').textContent = state.prints;
  document.getElementById('statSessions').textContent = state.sessions;

  // Recent photos
  const reel = document.getElementById('recentScroll');
  if (state.photos.length === 0) {
    reel.innerHTML = '<div class="recent-empty">No photos yet — booth is idle</div>';
  } else {
    reel.innerHTML = state.photos.slice().reverse().map(p =>
      `<div class="recent-thumb" onclick="openLightbox(${p.id})">
        <img src="/photos/${p.file}" alt="${p.template}" loading="lazy">
        <span class="time">${p.time}</span>
      </div>`
    ).join('');
  }

  // Log
  const logEl = document.getElementById('logArea');
  logEl.innerHTML = state.log.slice().reverse().map(e =>
    `<div class="log-entry">
      <span class="log-time">${e.ts}</span>
      <span class="log-${e.level}">${e.msg}</span>
    </div>`
  ).join('');
}

// ── Logging ──
function log(level, msg) {
  const now = new Date();
  const ts = now.toLocaleTimeString('en-AU', { hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit' });
  state.log.push({ ts, level, msg });
  if (state.log.length > 50) state.log.shift();
}

// ── Toast ──
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ══════════════════════════════════════════════════════════════
//  In real mode, POST to API then re-fetch state.
// ══════════════════════════════════════════════════════════════

function newCartridge() {

    fetch('/api/new-cartridge', { method: 'POST' })
      .then(r => r.json())
      .then(() => { toast('Cartridge reset'); poll(); });
  }


function cancelSession() {
  openModal('Cancel Session',
    'This will abort the current guest\'s session. They\'ll need to start over.',
    'Cancel It', 'danger', () => {
      
        fetch('/api/session/cancel', { method: 'POST' })
          .then(() => { toast('Session cancelled'); poll(); });
      }
    );
}

function confirmShutdown() {
  openModal('Shutdown Booth',
    'This will safely power down the Pi. You\'ll need physical access to restart it.',
    'Shut Down', 'danger', () => {
        fetch('/api/shutdown', { method: 'POST' });
        toast('Shutting down…');
      }
    );
}

// ── Modal ──
let pendingModalAction = null;
function openModal(title, body, confirmText, style, action) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').textContent = body;
  const btn = document.getElementById('modalConfirm');
  btn.textContent = confirmText;
  btn.className = 'modal-confirm' + (style === 'danger' ? ' danger' : '');
  pendingModalAction = action;
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  pendingModalAction = null;
}
function modalAction() {
  const action = pendingModalAction;
  closeModal();
  if (action) action();
}

// ══════════════════════════════════════════════════════════════
//  POLLING — in real mode, fetch /api/status every 2s
// ══════════════════════════════════════════════════════════════

function poll() {
  fetch('/api/status').then(r => r.json()).then(data => {
    // Map API response onto local state and render
    Object.assign(state, data);
    render();
  });
}

// Poll every 2 seconds
setInterval(poll, 2000);

// ══════════════════════════════════════════════════════════════
//  LIGHTBOX
// ══════════════════════════════════════════════════════════════

function openLightbox(id) {
  // Search recent photos from status, then full registry
  const allSources = [...allPhotos, ...state.photos];
  lightboxPhoto = allSources.find(p => p.id === id) || null;
  if (!lightboxPhoto) return;

  document.getElementById('lbImage').src = `/photos/${lightboxPhoto.file}`;
  document.getElementById('lbImage').alt = lightboxPhoto.template || '';
  document.getElementById('lbTemplate').textContent = lightboxPhoto.template || '';
  document.getElementById('lbTime').textContent = `${state.event} · ${lightboxPhoto.time}`;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
  lightboxPhoto = null;
}

function downloadLightboxPhoto() {
  if (!lightboxPhoto) return;
  const a = document.createElement('a');
  a.href = `/photos/${lightboxPhoto.file}`;
  a.download = lightboxPhoto.file;
  a.click();
}

document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target.id === 'lightbox') closeLightbox();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

// ══════════════════════════════════════════════════════════════
//  PHOTO MANAGEMENT
// ══════════════════════════════════════════════════════════════

let gridMode = 'composites';  // 'composites' | 'raws'
let rawPhotos = [];
let selectedRawFiles = new Set();

function setGridMode(mode) {
  gridMode = mode;
  selectedIds.clear();
  selectedRawFiles.clear();
  document.getElementById('btnComposites').classList.toggle('active', mode === 'composites');
  document.getElementById('btnRaws').classList.toggle('active', mode === 'raws');
  if (mode === 'raws') {
    loadRawPhotos();
  } else {
    loadAllPhotos();
  }
}

function loadAllPhotos() {
  fetch('/api/photos').then(r => r.json()).then(data => {
    allPhotos = data.photos || [];
    selectedIds.clear();
    renderPhotoGrid();
  });
}

function loadRawPhotos() {
  fetch('/api/photos/raw').then(r => r.json()).then(data => {
    rawPhotos = data.photos || [];
    selectedRawFiles.clear();
    renderPhotoGrid();
  });
}

function renderPhotoGrid() {
  const grid = document.getElementById('photoGrid');
  const deleteBtn = document.getElementById('deleteBtn');
  const selectAllBtn = document.getElementById('selectAllBtn');

  if (gridMode === 'composites') {
    if (allPhotos.length === 0) {
      grid.innerHTML = '<div class="photo-empty">No composite photos yet</div>';
      deleteBtn.disabled = true;
      selectAllBtn.textContent = 'Select all';
      return;
    }
    const sorted = allPhotos.slice().reverse();
    grid.innerHTML = sorted.map(p => {
      const sel = selectedIds.has(p.id);
      return `<div class="photo-tile${sel ? ' selected' : ''}" onclick="toggleTile(${p.id})">
        <img src="/photos/${p.file}" alt="${p.template}" loading="lazy">
        <div class="check">${sel ? '✓' : ''}</div>
      </div>`;
    }).join('');
    deleteBtn.disabled = selectedIds.size === 0;
    const allSel = selectedIds.size === allPhotos.length && allPhotos.length > 0;
    selectAllBtn.textContent = allSel ? 'Deselect all' : 'Select all';

  } else {
    if (rawPhotos.length === 0) {
      grid.innerHTML = '<div class="photo-empty">No raw shots found</div>';
      deleteBtn.disabled = true;
      selectAllBtn.textContent = 'Select all';
      return;
    }
    const sorted = rawPhotos.slice().reverse();
    grid.innerHTML = sorted.map(p => {
      const sel = selectedRawFiles.has(p.file);
      const idx = p.file.match(/_(\d+)\.jpg$/)?.[1] ?? '';
      return `<div class="photo-tile${sel ? ' selected' : ''}" onclick="toggleRawTile('${p.file}')">
        <img src="/photos/${p.file}" alt="raw" loading="lazy">
        <div class="check">${sel ? '✓' : ''}</div>
        <div class="raw-tile-label">shot ${idx}</div>
      </div>`;
    }).join('');
    deleteBtn.disabled = selectedRawFiles.size === 0;
    const allSel = selectedRawFiles.size === rawPhotos.length && rawPhotos.length > 0;
    selectAllBtn.textContent = allSel ? 'Deselect all' : 'Select all';
  }
}

function toggleTile(id) {
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  renderPhotoGrid();
}

function toggleRawTile(file) {
  if (selectedRawFiles.has(file)) selectedRawFiles.delete(file);
  else selectedRawFiles.add(file);
  renderPhotoGrid();
}

function toggleSelectAll() {
  if (gridMode === 'composites') {
    if (selectedIds.size === allPhotos.length) selectedIds.clear();
    else allPhotos.forEach(p => selectedIds.add(p.id));
  } else {
    if (selectedRawFiles.size === rawPhotos.length) selectedRawFiles.clear();
    else rawPhotos.forEach(p => selectedRawFiles.add(p.file));
  }
  renderPhotoGrid();
}

function confirmDeleteSelected() {
  const count = gridMode === 'composites' ? selectedIds.size : selectedRawFiles.size;
  if (count === 0) return;
  const label = gridMode === 'raws' ? 'raw shot' : 'photo';
  openModal(
    `Delete ${count} ${label}${count !== 1 ? 's' : ''}`,
    `This will permanently delete ${count} ${label}${count !== 1 ? 's' : ''} from disk. This cannot be undone.`,
    'Delete', 'danger',
    deleteSelected
  );
}

async function deleteSelected() {
  if (gridMode === 'composites') {
    const ids = [...selectedIds];
    for (const id of ids) {
      await fetch(`/api/photos/${id}`, { method: 'DELETE' });
    }
    selectedIds.clear();
    toast(`Deleted ${ids.length} composite${ids.length !== 1 ? 's' : ''}`);
    loadAllPhotos();
    poll();
  } else {
    const files = [...selectedRawFiles];
    for (const file of files) {
      await fetch(`/api/photos/raw/${encodeURIComponent(file)}`, { method: 'DELETE' });
    }
    selectedRawFiles.clear();
    toast(`Deleted ${files.length} raw shot${files.length !== 1 ? 's' : ''}`);
    loadRawPhotos();
  }
}

</script>
